<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>Mac</title>
<style>
  :root {
    --bg: #000; --deck: #2a2a2c; --deck-lo: #1f1f21; --well: #0a0a0b;
    --key: #161618; --key-hi: #2c2c2f; --legend: #ececee; --led: #32d74b;
    --ink: #f5f5f7; --ink-dim: #98989d; --line: #3a3a3d;
    --kh: clamp(31px, 5.3dvh, 46px); --gap: 3px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 400 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #screen { position: relative; flex: 1 1 0; min-height: 0; background: #000; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #cursor { position: absolute; left: 0; top: 0; width: 18px; height: 18px;
            pointer-events: none; display: none; will-change: transform; }
  #status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 10px 16px; border-radius: 999px; background: rgba(30,30,34,.9);
    color: var(--ink-dim); font-size: 13px; white-space: nowrap;
  }
  #status[hidden] { display: none; }

  #bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    padding: 6px 10px 2px; background: var(--deck);
    border-top: 1px solid var(--line);
  }
  #btn-pass { margin-right: auto; }
  #bar button {
    appearance: none; border: 0; border-radius: 999px; padding: 5px 11px; min-width: 40px;
    background: rgba(255,255,255,.07); color: var(--ink-dim); font: inherit; font-size: 11px;
    letter-spacing: .02em;
  }
  /* Coque aluminium « noir sidéral », puits de clavier noir, touches noires mates. */
  #deck {
    flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px;
    padding: 4px 8px 8px; background: linear-gradient(var(--deck), var(--deck-lo));
  }
  #deck.nokb #kb { display: none; }

  #kb {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--gap);
    padding: 4px; border-radius: 10px; background: var(--well);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 .5px 0 rgba(255,255,255,.08);
  }
  .row { display: flex; gap: var(--gap); align-items: flex-end; }
  .key {
    position: relative; flex: 1 1 0; min-width: 0; height: var(--kh);
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; background: var(--key); color: var(--legend);
    font-size: 15px; font-weight: 400;
    box-shadow: inset 0 .5px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.6);
  }
  /* Touches de fonction : légende dans un coin, comme sur un clavier Apple. */
  .key.fn { font-size: 13px; align-items: flex-end; padding: 0 6px 5px; }
  .key.fn.l { justify-content: flex-start; }
  .key.fn.r { justify-content: flex-end; }
  .key.word { font-size: 10px; letter-spacing: .01em; }
  .key.mod { flex-direction: column; align-items: flex-end; justify-content: space-between;
             padding: 5px 6px; font-size: 13px; }
  .key.mod small { align-self: stretch; text-align: center; font-size: 8.5px; color: var(--legend); }
  .key.w12 { flex-grow: 1.25; } .key.w15 { flex-grow: 1.5; } .key.w18 { flex-grow: 1.8; }
  .key.w5 { flex-grow: 4.6; }
  .key.half { height: calc((var(--kh) - var(--gap)) / 2); font-size: 9px; border-radius: 4px; }
  .stack { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .stack .key { flex: 0 0 auto; }
  .key.hit { background: var(--key-hi); }
  .key.on { background: var(--key-hi); }
  .key.on::before {                      /* témoin vert, façon verrouillage majuscules */
    content: ""; position: absolute; left: 5px; top: 5px; width: 4px; height: 4px;
    border-radius: 50%; background: var(--led); box-shadow: 0 0 4px var(--led);
  }
  @media (max-width: 560px) {            /* trop étroit pour « command » en toutes lettres */
    .key.mod { align-items: center; justify-content: center; font-size: 15px; }
    .key.mod small { display: none; }
  }

  /* Téléphone à l'horizontale : l'écran du Mac seul, en grand. */
  @media (orientation: landscape) and (max-height: 540px) {
    #bar, #deck { display: none; }
  }

  #pad {
    position: relative; flex: 1 1 0; min-height: 60px; align-self: center;
    width: min(100%, 520px); border-radius: 12px;
    background: linear-gradient(#2d2d30, #262628);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <video id="video" autoplay playsinline muted></video>
    <svg id="cursor" viewBox="0 0 18 18"><path d="M2 1l0 14 4-3.6 2.6 5.6 2.3-1-2.6-5.5 5.4-.3z"
      fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <div id="status">Connexion…</div>
  </div>
  <div id="bar">
    <button id="btn-pass" aria-label="Choisir ou changer le mot de passe">Mot de passe</button>
    <button id="btn-layout" aria-label="Disposition du clavier">AZERTY</button>
    <button id="btn-kb" aria-label="Afficher ou masquer le clavier">Clavier</button>
  </div>
  <div id="deck">
    <div id="kb"></div>
    <div id="pad"></div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const video = $('video'), statusEl = $('status'), cursorEl = $('cursor'), screenEl = $('screen');

function setStatus(text) { statusEl.hidden = !text; if (text) statusEl.textContent = text; }

/* ------------------------------------------------ canal de commandes */
let ws = null, queue = [];
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.onopen = () => { queue.splice(0).forEach(m => ws.send(m)); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.t === 'cursor') placeCursor(m.x, m.y); };
  ws.onclose = () => { ws = null; checkSession(); setTimeout(connectWS, 1000); };
}
/* Connexion par mot de passe : si la session a expiré, revenir à la page de connexion. */
function checkSession() {
  if (token) return;
  fetch('/', { cache: 'no-store' }).then(r => { if (r.status === 401) location.reload(); }, () => {});
}
function send(msg) {
  const data = JSON.stringify(msg);
  if (ws && ws.readyState === 1) ws.send(data);
  else if (msg.t !== 'move' && msg.t !== 'scroll' && queue.length < 50) queue.push(data);
}

/* ------------------------------------------------------------- vidéo */
let pc = null, retry = null;
async function connectVideo() {
  clearTimeout(retry);
  if (pc) { pc.onconnectionstatechange = null; pc.close(); }
  setStatus('Connexion…');
  const me = pc = new RTCPeerConnection();
  const tr = pc.addTransceiver('video', { direction: 'recvonly' });
  try { tr.receiver.jitterBufferTarget = 0; } catch (e) {}
  pc.ontrack = e => { video.srcObject = new MediaStream([e.track]); video.play().catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (me !== pc) return;
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) scheduleRetry();
  };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const done = () => pc.iceGatheringState === 'complete' && res();
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(res, 1500);
    });
    const r = await fetch(`/offer?t=${encodeURIComponent(token)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    if (r.status === 403) {
      if (!token) return location.reload();             // session expirée : page de connexion
      return setStatus('Lien invalide : rouvre l’adresse affichée sur le Mac.');
    }
    if (!r.ok) throw new Error(r.status);
    if (me === pc) await pc.setRemoteDescription(await r.json());
  } catch (e) { if (me === pc) scheduleRetry(); }
}
function scheduleRetry() {
  setStatus('Mac injoignable, nouvelle tentative…');
  clearTimeout(retry);
  retry = setTimeout(connectVideo, 1500);
}
video.addEventListener('playing', () => setStatus(''));
video.addEventListener('resize', () => placeCursor());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!pc || pc.connectionState !== 'connected')) connectVideo();
});

/* Zone réellement occupée par l'image (object-fit: contain). */
function videoRect() {
  const W = screenEl.clientWidth, H = screenEl.clientHeight;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const s = Math.min(W / vw, H / vh);
  return { x: (W - vw * s) / 2, y: (H - vh * s) / 2, w: vw * s, h: vh * s };
}
let lastCursor = null;
function placeCursor(x, y) {
  if (x !== undefined) lastCursor = { x, y };
  const r = videoRect();
  if (!r || !lastCursor) return;
  cursorEl.style.display = 'block';
  cursorEl.style.transform =
    `translate(${r.x + lastCursor.x * r.w - 2}px, ${r.y + lastCursor.y * r.h - 1}px)`;
}
addEventListener('resize', () => placeCursor());
/* ---------------------------------------------------- gestes tactiles */
/* ---------------------------------------------------------- trackpad */
const pad = $('pad');
const TAP_MS = 250, TAP_PX = 8, DRAG_MS = 220, SPEED = 1.5;
let acc = { dx: 0, dy: 0, sx: 0, sy: 0, pos: null }, flushPending = false;

function flush() {
  flushPending = false;
  if (acc.pos) send({ t: 'moveto', x: +acc.pos.x.toFixed(4), y: +acc.pos.y.toFixed(4) });
  if (acc.dx || acc.dy) send({ t: 'move', dx: +acc.dx.toFixed(2), dy: +acc.dy.toFixed(2) });
  if (acc.sx || acc.sy) send({ t: 'scroll', dx: +acc.sx.toFixed(1), dy: +acc.sy.toFixed(1) });
  acc = { dx: 0, dy: 0, sx: 0, sy: 0, pos: null };
}
function queueFlush() { if (!flushPending) { flushPending = true; requestAnimationFrame(flush); } }

/* Toucher directement l'image : les gestes du trackpad, mais en position absolue.
   Glisser = le curseur suit le doigt ; tape = clic sous le doigt ; tape à deux doigts =
   clic droit ; deux doigts qui glissent = défilement ; tape puis glisser = glisser-déposer. */
const NEAR_PX = 28;              // « au même endroit », pour un doigt
const touches = new Map();
let sg = null;                   // geste en cours sur l'image
let lastScreenTap = { t: 0, x: 0, y: 0 };
function toScreen(cx, cy) {
  const r = videoRect(); if (!r) return null;
  const b = screenEl.getBoundingClientRect();
  return { x: (cx - b.left - r.x) / r.w, y: (cy - b.top - r.y) / r.h };
}
const clamp01 = p => ({ x: Math.min(Math.max(p.x, 0), 1), y: Math.min(Math.max(p.y, 0), 1) });
function cursorClient() {        // position du curseur du Mac, en pixels de la page
  const r = videoRect(); if (!r || !lastCursor) return null;
  const b = screenEl.getBoundingClientRect();
  return { x: b.left + r.x + lastCursor.x * r.w, y: b.top + r.y + lastCursor.y * r.h };
}
screenEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!touches.size) {
    const p = toScreen(e.clientX, e.clientY);
    if (!p || p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) return;      // bandes noires
    const now = performance.now();
    sg = { t0: now, max: 1, travel: 0, drag: false, aimed: false, x0: e.clientX, y0: e.clientY };
    const again = now - lastScreenTap.t < DRAG_MS + 80 &&
      Math.hypot(e.clientX - lastScreenTap.x, e.clientY - lastScreenTap.y) < NEAR_PX;
    if (again) { sg.drag = true; send({ t: 'down', b: 'left' }); }    // 2e clic, ou début de glisser
  } else if (sg) sg.max = Math.max(sg.max, touches.size + 1);
  else return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { screenEl.setPointerCapture(e.pointerId); } catch (err) {}
});
screenEl.addEventListener('pointermove', e => {
  const f = touches.get(e.pointerId); if (!f || !sg) return;
  const dx = e.clientX - f.x, dy = e.clientY - f.y;
  f.x = e.clientX; f.y = e.clientY;
  sg.travel += Math.hypot(dx, dy);
  if (sg.travel < TAP_PX) return;            // encore peut-être une tape
  if (touches.size === 1 && sg.max === 1) {
    const p = toScreen(e.clientX, e.clientY); if (p) acc.pos = clamp01(p);
  } else if (touches.size >= 2) {
    if (!sg.aimed) {                         // le Mac fait défiler ce qui est sous le curseur
      sg.aimed = true;
      const p = toScreen(sg.x0, sg.y0); if (p) acc.pos = clamp01(p);
    }
    const r = videoRect();                   // le contenu suit à peu près les doigts
    const k = Math.max(1.2, r ? video.videoWidth / r.w * 0.75 : 1.2) / touches.size;
    acc.sx += dx * k; acc.sy += dy * k;
  }
  queueFlush();
});
function screenUp(e) {
  if (!touches.delete(e.pointerId) || touches.size || !sg) return;
  flush();
  const now = performance.now();
  const tap = sg.travel < TAP_PX && now - sg.t0 < TAP_MS + 50;
  if (sg.drag) {                             // fin de glisser, ou 2e clic d'un double-clic
    send({ t: 'up', b: 'left' });
    if (tap) lastScreenTap.t = now;
  } else if (tap) {
    const b = sg.max >= 2 ? 'right' : 'left';
    const c = cursorClient();                // tape sur le curseur : clic sans le déplacer
    const onCursor = c && Math.hypot(sg.x0 - c.x, sg.y0 - c.y) < NEAR_PX;
    const p = toScreen(sg.x0, sg.y0);
    if (p && !onCursor) send({ t: 'moveto', x: +p.x.toFixed(4), y: +p.y.toFixed(4) });
    send({ t: 'down', b }); send({ t: 'up', b });
    if (b === 'left') lastScreenTap = { t: now, x: sg.x0, y: sg.y0 };
  }
  sg = null;
}
screenEl.addEventListener('pointerup', screenUp);
screenEl.addEventListener('pointercancel', screenUp);

/* Le trackpad : déplacements relatifs. */
const fingers = new Map();
let g = null;                    // geste en cours
let lastTap = 0;                 // fin du dernier tap à un doigt

pad.addEventListener('pointerdown', e => {
  e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fingers.size === 1) {
    g = { t0: performance.now(), max: 1, travel: 0, drag: false };
    if (g.t0 - lastTap < DRAG_MS) { g.drag = true; send({ t: 'down', b: 'left' }); }
  } else if (g) g.max = Math.max(g.max, fingers.size);
});
pad.addEventListener('pointermove', e => {
  const f = fingers.get(e.pointerId); if (!f || !g) return;
  const dx = e.clientX - f.x, dy = e.clientY - f.y;
  f.x = e.clientX; f.y = e.clientY;
  g.travel += Math.hypot(dx, dy);
  if (g.travel < TAP_PX) return;             // encore peut-être un tap
  if (fingers.size === 1 && g.max === 1) {
    const k = SPEED * (1 + Math.min(Math.hypot(dx, dy) / 12, 2));   // accélération
    acc.dx += dx * k; acc.dy += dy * k;
  } else if (fingers.size >= 2) {
    acc.sx += dx * 1.2 / fingers.size; acc.sy += dy * 1.2 / fingers.size;
  }
  queueFlush();
});
function padUp(e) {
  if (!fingers.delete(e.pointerId) || fingers.size || !g) return;
  flush();
  const tap = g.travel < TAP_PX && performance.now() - g.t0 < TAP_MS;
  if (g.drag) send({ t: 'up', b: 'left' });                 // fin de glisser, ou 2e clic
  else if (tap) {
    const b = g.max >= 2 ? 'right' : 'left';
    send({ t: 'down', b }); send({ t: 'up', b });
    if (b === 'left') lastTap = performance.now();
  }
  g = null;
}
pad.addEventListener('pointerup', padUp);
pad.addEventListener('pointercancel', padUp);

/* ----------------------------------------------------------- clavier */
const LAYOUTS = {
  AZERTY: ['azertyuiop', 'qsdfghjklm', "wxcvbn,.'"],
  QWERTY: ['qwertyuiop', "asdfghjkl'", 'zxcvbnm,.'],
};
const SYMBOLS = ['-_/:;()@&"', '!?+=*%#€$~', 'éèàçù[]{}<>|\\'];
const LABELS = { Escape: 'esc', Backspace: '⌫', Tab: '⇥', Enter: '↩', Space: '',
  ArrowLeft: '◀', ArrowRight: '▶', ArrowUp: '▲', ArrowDown: '▼',
  shift: '⇧', ctrl: '⌃', alt: '⌥', cmd: '⌘', sym: '#+=' };
const WORDS = { ctrl: 'control', alt: 'option', cmd: 'command' };
const MODS = ['shift', 'ctrl', 'alt', 'cmd'];
const kb = $('kb');
let layout = (navigator.language || '').toLowerCase().startsWith('fr') ? 'AZERTY' : 'QWERTY';
try { layout = localStorage.getItem('layout') || layout; } catch (e) {}
let symbols = false;
const active = new Set();        // modificateurs armés pour la prochaine touche

function keyEl(k, cls) {
  const d = document.createElement('div');
  d.className = 'key ' + (cls || '');
  d.dataset.k = k;
  // Légendes en capitales comme sur un clavier Apple ; les accentuées restent telles quelles.
  d.textContent = k.length === 1 ? (symbols ? k : k.toUpperCase()) : LABELS[k];
  if (WORDS[k]) d.insertAdjacentHTML('beforeend', `<small>${WORDS[k]}</small>`);
  if (active.has(k) || (k === 'sym' && symbols)) d.classList.add('on');
  return d;
}
function render() {
  const rows = symbols ? SYMBOLS : LAYOUTS[layout];
  const spec = [
    [['Escape', 'fn l word'], ...'1234567890', ['Backspace', 'fn r w15']],
    [['Tab', 'fn l w15'], ...rows[0]],
    [...rows[1], ['Enter', 'fn r w15']],
    [['shift', 'fn l w18'], ...rows[2], ['shift', 'fn r w18']],
    [['ctrl', 'mod w12'], ['alt', 'mod w12'], ['cmd', 'mod w15'], ['Space', 'w5'],
     ['sym', 'fn word w12'], ['ArrowLeft', 'half'],
     [['ArrowUp', 'half'], ['ArrowDown', 'half']], ['ArrowRight', 'half']],
  ];
  const build = k => {
    if (!Array.isArray(k)) return keyEl(k);
    if (!Array.isArray(k[0])) return keyEl(k[0], k[1]);
    const st = document.createElement('div'); st.className = 'stack';   // ▲ sur ▼
    st.append(...k.map(build));
    return st;
  };
  kb.replaceChildren(...spec.map(r => {
    const row = document.createElement('div'); row.className = 'row';
    row.append(...r.map(build));
    return row;
  }));
  $('btn-layout').textContent = layout;
}
function press(k) {
  const mods = [...active];
  const shortcut = mods.some(m => m !== 'shift');
  if (k.length === 1 && !shortcut) send({ t: 'key', key: active.has('shift') ? k.toUpperCase() : k, mods: [] });
  else send({ t: 'key', key: k, mods });
}
let repeat = null;
function stopRepeat() { clearTimeout(repeat); clearInterval(repeat); repeat = null; }
kb.addEventListener('pointerdown', e => {
  e.preventDefault();
  const el = e.target.closest('.key'); if (!el) return;
  const k = el.dataset.k;
  if (k === 'sym') { symbols = !symbols; return render(); }
  if (MODS.includes(k)) { active.has(k) ? active.delete(k) : active.add(k); return render(); }
  el.classList.add('hit');
  press(k);
  stopRepeat();
  if (!active.size) repeat = setTimeout(() => { repeat = setInterval(() => press(k), 55); }, 420);
  const release = () => {
    stopRepeat(); el.classList.remove('hit');
    removeEventListener('pointerup', release); removeEventListener('pointercancel', release);
    if (active.size) { active.clear(); render(); }       // modificateurs à usage unique
  };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
});

$('btn-layout').addEventListener('click', () => {
  layout = layout === 'AZERTY' ? 'QWERTY' : 'AZERTY';
  try { localStorage.setItem('layout', layout); } catch (e) {}
  symbols = false; render();
});
$('btn-pass').addEventListener('click', () => { location.href = '/password' + location.search; });
$('btn-kb').addEventListener('click', () => {
  $('deck').classList.toggle('nokb');
  requestAnimationFrame(() => placeCursor());
});

/* Safari : bloque le zoom par pincement et le double-tap. */
for (const ev of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'])
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

render();
connectWS();
connectVideo();
</script>
</body>
</html>
