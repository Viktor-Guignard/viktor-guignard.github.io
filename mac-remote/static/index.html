<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>Mac</title>
<style>
  :root {
    --bg: #0b0b0d; --deck: #131316; --key: #2a2a30; --key-fn: #1d1d22;
    --key-on: #e8e2d6; --ink: #f2f0ea; --ink-dim: #8c8a85; --pad: #1a1a1f; --line: #2c2c33;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #screen { position: relative; flex: 1 1 0; min-height: 0; background: #000; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #cursor { position: absolute; left: 0; top: 0; width: 18px; height: 18px;
            pointer-events: none; display: none; will-change: transform; }
  #status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 10px 16px; border-radius: 999px; background: rgba(30,30,34,.9);
    color: var(--ink-dim); font-size: 13px; white-space: nowrap;
  }
  #status[hidden] { display: none; }

  #bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    padding: 5px 8px; background: var(--deck); border-top: 1px solid var(--line);
  }
  #bar button {
    appearance: none; border: 0; border-radius: 7px; padding: 6px 10px; min-width: 40px;
    background: var(--key-fn); color: var(--ink-dim); font: inherit; font-size: 12px;
  }
  #deck { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
          gap: 6px; padding: 0 6px 6px; background: var(--deck); }
  #deck.nokb #kb { display: none; }

  #kb { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; }
  .row { display: flex; gap: 4px; }
  .key {
    flex: 1 1 0; min-width: 0; height: clamp(30px, 5.2dvh, 44px);
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px; background: var(--key); color: var(--ink); font-size: 16px;
  }
  .key.fn { background: var(--key-fn); color: var(--ink-dim); font-size: 12px; }
  .key.w15 { flex-grow: 1.5; } .key.w2 { flex-grow: 2; } .key.w5 { flex-grow: 5; }
  .key.hit { background: #4a4a54; }
  .key.on { background: var(--key-on); color: #111; }

  #pad {
    position: relative; flex: 1 1 0; min-height: 60px; border-radius: 14px;
    background: var(--pad); border: 1px solid var(--line);
  }
  #pad::after {
    content: "trackpad"; position: absolute; inset: auto 0 10px 0; text-align: center;
    color: #3a3a42; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <video id="video" autoplay playsinline muted></video>
    <svg id="cursor" viewBox="0 0 18 18"><path d="M2 1l0 14 4-3.6 2.6 5.6 2.3-1-2.6-5.5 5.4-.3z"
      fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <div id="status">Connexion…</div>
  </div>
  <div id="bar">
    <button id="btn-layout" aria-label="Disposition du clavier">AZERTY</button>
    <button id="btn-kb" aria-label="Afficher ou masquer le clavier">Clavier</button>
  </div>
  <div id="deck">
    <div id="kb"></div>
    <div id="pad"></div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const video = $('video'), statusEl = $('status'), cursorEl = $('cursor'), screenEl = $('screen');

function setStatus(text) { statusEl.hidden = !text; if (text) statusEl.textContent = text; }

/* ------------------------------------------------ canal de commandes */
let ws = null, queue = [];
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.onopen = () => { queue.splice(0).forEach(m => ws.send(m)); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.t === 'cursor') placeCursor(m.x, m.y); };
  ws.onclose = () => { ws = null; setTimeout(connectWS, 1000); };
}
function send(msg) {
  const data = JSON.stringify(msg);
  if (ws && ws.readyState === 1) ws.send(data);
  else if (msg.t !== 'move' && msg.t !== 'scroll' && queue.length < 50) queue.push(data);
}

/* ------------------------------------------------------------- vidéo */
let pc = null, retry = null;
async function connectVideo() {
  clearTimeout(retry);
  if (pc) { pc.onconnectionstatechange = null; pc.close(); }
  setStatus('Connexion…');
  const me = pc = new RTCPeerConnection();
  const tr = pc.addTransceiver('video', { direction: 'recvonly' });
  try { tr.receiver.jitterBufferTarget = 0; } catch (e) {}
  pc.ontrack = e => { video.srcObject = new MediaStream([e.track]); video.play().catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (me !== pc) return;
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) scheduleRetry();
  };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const done = () => pc.iceGatheringState === 'complete' && res();
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(res, 1500);
    });
    const r = await fetch(`/offer?t=${encodeURIComponent(token)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    if (r.status === 403) return setStatus('Lien invalide : rouvre l’adresse affichée sur le Mac.');
    if (!r.ok) throw new Error(r.status);
    if (me === pc) await pc.setRemoteDescription(await r.json());
  } catch (e) { if (me === pc) scheduleRetry(); }
}
function scheduleRetry() {
  setStatus('Mac injoignable, nouvelle tentative…');
  clearTimeout(retry);
  retry = setTimeout(connectVideo, 1500);
}
video.addEventListener('playing', () => setStatus(''));
video.addEventListener('resize', () => placeCursor());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!pc || pc.connectionState !== 'connected')) connectVideo();
});

/* Zone réellement occupée par l'image (object-fit: contain). */
function videoRect() {
  const W = screenEl.clientWidth, H = screenEl.clientHeight;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const s = Math.min(W / vw, H / vh);
  return { x: (W - vw * s) / 2, y: (H - vh * s) / 2, w: vw * s, h: vh * s };
}
let lastCursor = null;
function placeCursor(x, y) {
  if (x !== undefined) lastCursor = { x, y };
  const r = videoRect();
  if (!r || !lastCursor) return;
  cursorEl.style.display = 'block';
  cursorEl.style.transform =
    `translate(${r.x + lastCursor.x * r.w - 2}px, ${r.y + lastCursor.y * r.h - 1}px)`;
}
addEventListener('resize', () => placeCursor());

/* Toucher directement l'image : le curseur va sous le doigt, appui = clic. */
let direct = null;
function toScreen(e) {
  const r = videoRect(); if (!r) return null;
  const b = screenEl.getBoundingClientRect();
  return { x: (e.clientX - b.left - r.x) / r.w, y: (e.clientY - b.top - r.y) / r.h };
}
screenEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toScreen(e);
  if (direct !== null || !p || p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) return;
  direct = e.pointerId; try { screenEl.setPointerCapture(e.pointerId); } catch (err) {}
  send({ t: 'moveto', x: p.x, y: p.y }); send({ t: 'down', b: 'left' });
});
screenEl.addEventListener('pointermove', e => {
  if (e.pointerId !== direct) return;
  const p = toScreen(e); if (p) send({ t: 'moveto', x: p.x, y: p.y });
});
function endDirect(e) { if (e.pointerId === direct) { direct = null; send({ t: 'up', b: 'left' }); } }
screenEl.addEventListener('pointerup', endDirect);
screenEl.addEventListener('pointercancel', endDirect);

/* ---------------------------------------------------------- trackpad */
const pad = $('pad');
const TAP_MS = 250, TAP_PX = 8, DRAG_MS = 220, SPEED = 1.5;
const fingers = new Map();
let g = null;                    // geste en cours
let lastTap = 0;                 // fin du dernier tap à un doigt
let acc = { dx: 0, dy: 0, sx: 0, sy: 0 }, flushPending = false;

function flush() {
  flushPending = false;
  if (acc.dx || acc.dy) send({ t: 'move', dx: +acc.dx.toFixed(2), dy: +acc.dy.toFixed(2) });
  if (acc.sx || acc.sy) send({ t: 'scroll', dx: +acc.sx.toFixed(1), dy: +acc.sy.toFixed(1) });
  acc = { dx: 0, dy: 0, sx: 0, sy: 0 };
}
function queueFlush() { if (!flushPending) { flushPending = true; requestAnimationFrame(flush); } }

pad.addEventListener('pointerdown', e => {
  e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fingers.size === 1) {
    g = { t0: performance.now(), max: 1, travel: 0, drag: false };
    if (g.t0 - lastTap < DRAG_MS) { g.drag = true; send({ t: 'down', b: 'left' }); }
  } else if (g) g.max = Math.max(g.max, fingers.size);
});
pad.addEventListener('pointermove', e => {
  const f = fingers.get(e.pointerId); if (!f || !g) return;
  const dx = e.clientX - f.x, dy = e.clientY - f.y;
  f.x = e.clientX; f.y = e.clientY;
  g.travel += Math.hypot(dx, dy);
  if (g.travel < TAP_PX) return;             // encore peut-être un tap
  if (fingers.size === 1 && g.max === 1) {
    const k = SPEED * (1 + Math.min(Math.hypot(dx, dy) / 12, 2));   // accélération
    acc.dx += dx * k; acc.dy += dy * k;
  } else if (fingers.size >= 2) {
    acc.sx += dx * 1.2 / fingers.size; acc.sy += dy * 1.2 / fingers.size;
  }
  queueFlush();
});
function padUp(e) {
  if (!fingers.delete(e.pointerId) || fingers.size || !g) return;
  flush();
  const tap = g.travel < TAP_PX && performance.now() - g.t0 < TAP_MS;
  if (g.drag) send({ t: 'up', b: 'left' });                 // fin de glisser, ou 2e clic
  else if (tap) {
    const b = g.max >= 2 ? 'right' : 'left';
    send({ t: 'down', b }); send({ t: 'up', b });
    if (b === 'left') lastTap = performance.now();
  }
  g = null;
}
pad.addEventListener('pointerup', padUp);
pad.addEventListener('pointercancel', padUp);

/* ----------------------------------------------------------- clavier */
const LAYOUTS = {
  AZERTY: ['azertyuiop', 'qsdfghjklm', "wxcvbn,.'"],
  QWERTY: ['qwertyuiop', "asdfghjkl'", 'zxcvbnm,.'],
};
const SYMBOLS = ['-_/:;()@&"', '!?+=*%#€$~', 'éèàçù[]{}<>|\\'];
const LABELS = { Escape: 'esc', Backspace: '⌫', Tab: '⇥', Enter: '⏎', Space: '',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
  shift: '⇧', ctrl: 'ctrl', alt: 'opt', cmd: '⌘', sym: '#+=' };
const MODS = ['shift', 'ctrl', 'alt', 'cmd'];
const kb = $('kb');
let layout = (navigator.language || '').toLowerCase().startsWith('fr') ? 'AZERTY' : 'QWERTY';
try { layout = localStorage.getItem('layout') || layout; } catch (e) {}
let symbols = false;
const active = new Set();        // modificateurs armés pour la prochaine touche

function keyEl(k, cls) {
  const d = document.createElement('div');
  d.className = 'key ' + (cls || '');
  d.dataset.k = k;
  const letter = k.length === 1;
  d.textContent = letter ? (active.has('shift') ? k.toUpperCase() : k) : LABELS[k];
  if (active.has(k) || (k === 'sym' && symbols)) d.classList.add('on');
  return d;
}
function render() {
  const rows = symbols ? SYMBOLS : LAYOUTS[layout];
  const spec = [
    [['Escape', 'fn'], ...'1234567890', ['Backspace', 'fn w15']],
    [['Tab', 'fn'], ...rows[0]],
    [...rows[1], ['Enter', 'fn w15']],
    [['shift', 'fn w15'], ...rows[2], ['ArrowUp', 'fn']],
    [['ctrl', 'fn'], ['alt', 'fn'], ['cmd', 'fn'], ['Space', 'w5'], ['sym', 'fn'],
     ['ArrowLeft', 'fn'], ['ArrowDown', 'fn'], ['ArrowRight', 'fn']],
  ];
  kb.replaceChildren(...spec.map(r => {
    const row = document.createElement('div'); row.className = 'row';
    row.append(...r.map(k => Array.isArray(k) ? keyEl(k[0], k[1]) : keyEl(k)));
    return row;
  }));
  $('btn-layout').textContent = layout;
}
function press(k) {
  const mods = [...active];
  const shortcut = mods.some(m => m !== 'shift');
  if (k.length === 1 && !shortcut) send({ t: 'key', key: active.has('shift') ? k.toUpperCase() : k, mods: [] });
  else send({ t: 'key', key: k, mods });
}
let repeat = null;
function stopRepeat() { clearTimeout(repeat); clearInterval(repeat); repeat = null; }
kb.addEventListener('pointerdown', e => {
  e.preventDefault();
  const el = e.target.closest('.key'); if (!el) return;
  const k = el.dataset.k;
  if (k === 'sym') { symbols = !symbols; return render(); }
  if (MODS.includes(k)) { active.has(k) ? active.delete(k) : active.add(k); return render(); }
  el.classList.add('hit');
  press(k);
  stopRepeat();
  if (!active.size) repeat = setTimeout(() => { repeat = setInterval(() => press(k), 55); }, 420);
  const release = () => {
    stopRepeat(); el.classList.remove('hit');
    removeEventListener('pointerup', release); removeEventListener('pointercancel', release);
    if (active.size) { active.clear(); render(); }       // modificateurs à usage unique
  };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
});

$('btn-layout').addEventListener('click', () => {
  layout = layout === 'AZERTY' ? 'QWERTY' : 'AZERTY';
  try { localStorage.setItem('layout', layout); } catch (e) {}
  symbols = false; render();
});
$('btn-kb').addEventListener('click', () => {
  $('deck').classList.toggle('nokb');
  requestAnimationFrame(() => placeCursor());
});

/* Safari : bloque le zoom par pincement et le double-tap. */
for (const ev of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'])
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

render();
connectWS();
connectVideo();
</script>
</body>
</html>
